[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrails-vs-laser-data"
version = "0.1.0"
description = "Compare NVDB guardrails with airborne laser returns"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "numpy>=1.26,<3", "pandas>=2.2,<3", "shapely>=2.1,<3", "geopandas>=1.0,<2", "laspy[lazrs]>=2.5,<3", "pyproj>=3.6,<4", "scipy>=1.12,<2", "scikit-learn>=1.5,<2", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "psutil>=5.9,<8"]

[project.scripts]
guardrail = "guardrails.cli:main"

[tool.setuptools.packages.find]
include = ["guardrails*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
